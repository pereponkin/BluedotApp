[project]
name = "bluedot-agent"
version = "0.2.0"
description = "Local search assistant for Blue Dot Sessions filters"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.60,<1.61",
  "pyyaml>=6.0.3,<7",
]

[project.scripts]
bluedot-agent = "bluedot_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bluedot_agent*"]

[tool.setuptools.package-data]
bluedot_agent = ["panel.js", "resources/*.yaml"]
